version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: venturacom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-venturacom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-venturacom_pass}
      POSTGRES_DB: ${DB_NAME:-venturacom_sri}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-venturacom}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: venturacom_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
