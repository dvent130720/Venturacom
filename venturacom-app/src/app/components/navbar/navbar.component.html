<nav class="navbar">
  <div class="navbar__brand" (click)="scrollTo('hero')">
    <div class="navbar__logo">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="8" fill="#6C63FF"/>
        <path d="M8 28L16 12L24 28" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10.5 22H21.5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="30" cy="20" r="5" fill="#A78BFA"/>
      </svg>
    </div>
    <span class="navbar__name">Ventura<strong>Comp</strong></span>
  </div>

  <button class="navbar__hamburger" (click)="mobileOpen.set(!mobileOpen())">
    <span></span><span></span><span></span>
  </button>

  <div class="navbar__links" [class.open]="mobileOpen()">
    @for (section of sections; track section.anchor) {
      <button class="navbar__link" (click)="scrollTo(section.anchor)">{{ section.label }}</button>
    }
  </div>

  <div class="navbar__actions">
    @if (auth.isAuthenticated()) {
      <button class="btn-dashboard" (click)="goToDashboard()">Dashboard</button>
      <button class="btn-logout" (click)="auth.logout()">Salir</button>
    } @else {
      <button class="btn-login" (click)="openLogin.emit()">Login</button>
    }
  </div>
</nav>
